name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip
        run: |
          z=$(find . -maxdepth 4 -iname "*.zip" | head -n1)
          if [ -z "$z" ]; then echo "ZIP not found in repo"; ls -la; exit 1; fi
          echo "Using $z"
          mkdir -p proj
          unzip -q -o "$z" -d proj

      - name: Build
        run: |
          d=$(dirname "$(find proj -name settings.gradle.kts | head -n1)")
          cd "$d"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI-apk
          path: proj/**/build/outputs/apk/debug/*.apk
